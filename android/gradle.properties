org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# The project lives on D: while the global pub/Gradle caches live on C: —
# Kotlin's incremental build-tools-api compiler can't compute a relative
# path between files on different Windows drive roots and crashes closing
# its cache ("this and base files have different roots"). Disabling
# incremental Kotlin compilation avoids that path entirely; full
# recompiles are slower but reliable across drives.
kotlin.incremental=false
